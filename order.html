<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформлення ЧиксаКард</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>ЧиксаБанк</h1>
        <nav>
            <a href="index.html">Головна</a>
            <a href="order.html">Замовити картку</a>
            <a href="card.html">Моя картка</a>
        </nav>
    </header>

    <main>
        <h2>Оформлення ЧиксаКард</h2>
        <form action="card.html" method="GET">
            <label for="name">Ваше ім'я:</label>
            <input type="text" id="name" name="name" required>

            <label for="phone">Номер телефону:</label>
            <input type="tel" id="phone" name="phone" required>

            <label for="color">Колір картки:</label>
            <select id="color" name="color">
                <option value="purple">Фіолетова (Monobank)</option>
                <option value="yellow">Жовта (Tinkoff)</option>
                <option value="black">Чорна (Premium)</option>
            </select>

            <button type="submit">Замовити</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 ЧиксаБанк. Всі права захищені.</p>
    </footer>

</body>
</html>
