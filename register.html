<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація - ChiksaBank</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>ChiksaBank</h1>
        <p>Створіть новий акаунт</p>
    </header>

    <main>
        <section class="register">
            <h2>Реєстрація</h2>
            <input type="text" id="newUsername" placeholder="Введіть логін">
            <input type="password" id="newPassword" placeholder="Введіть пароль">
            <button onclick="register()">Зареєструватися</button>
            <p id="success-msg" style="color: green;"></p>
            <p id="error-msg" style="color: red;"></p>
            <p>Вже є акаунт? <a href="login.html">Увійти</a></p>
        </section>
    </main>

    <script>
        function register() {
            let newUsername = document.getElementById("newUsername").value;
            let newPassword = document.getElementById("newPassword").value;

            if (newUsername === "" || newPassword === "") {
                document.getElementById("error-msg").innerText = "❌ Всі поля мають бути заповнені!";
                return;
            }

            localStorage.setItem("savedUsername", newUsername);
            localStorage.setItem("savedPassword", newPassword);
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("userName", newUsername);

            document.getElementById("success-msg").innerText = "✅ Реєстрація успішна! Перехід...";
            setTimeout(() => {
                window.location.href = "profile.html";
            }, 1000);
        }
    </script>
</body>
</html>
